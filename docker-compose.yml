version: '3.9'

# ============================================================
# 货车调度管理系统 - Docker Compose
# 数据库使用 Supabase（云端 PostgreSQL），本地只启动后端+前端
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truck_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: http://localhost
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_API_KEY:-}
    container_name: truck_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
